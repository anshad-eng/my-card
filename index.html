<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anshad | Alfayiz Agency</title>
    
    <!-- Premium Fonts: 'Outfit' for modern luxury -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #D4AF37;
            --gold-gradient: linear-gradient(135deg, #D4AF37 0%, #F2D06B 50%, #997B28 100%);
            --glass-bg: rgba(20, 20, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --bg-dark: #050505;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* --- ANIMATED BACKGROUND --- */
        .ambient-light {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000000 100%);
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 10s infinite ease-in-out;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: #D4AF37; /* Gold */
            top: -50px;
            left: -50px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: #2a2a2a; /* Deep Grey */
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            50% { transform: translate(30px, 50px); }
            100% { transform: translate(0, 0); }
        }

        /* --- GLASS CARD --- */
        .glass-card {
            width: 90%;
            max-width: 400px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            /* Entrance + Floating Animation */
            animation: fadeUp 0.8s ease-out, cardFloat 6s ease-in-out infinite;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- PROFILE --- */
        .profile-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            transition: transform 0.3s ease;
        }

        .profile-wrapper:hover {
            transform: scale(1.05);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            z-index: 2;
        }

        /* Pulsing Glow */
        .profile-wrapper::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            background: var(--gold-gradient);
            z-index: 1;
            opacity: 0.3;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.1; }
            100% { transform: scale(1); opacity: 0.3; }
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
            /* Text Shimmer Effect */
            background: linear-gradient(to right, #ffffff, #999999, #ffffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShine 4s linear infinite;
        }

        @keyframes textShine {
            to { background-position: 200% center; }
        }

        .title {
            color: var(--gold);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
            font-weight: 500;
        }
        
        .agency {
            color: #888;
            font-size: 13px;
            margin-top: 5px;
            margin-bottom: 35px;
        }

        /* --- BUTTONS --- */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden; /* Vital for shine effect */
        }

        /* The "Sheen" Swipe Effect */
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            letter-spacing: 0.5px;
        }

        /* Primary Gold Button */
        .btn-gold {
            background: var(--gold-gradient);
            color: #000;
            font-weight: 700;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
            border: none;
        }

        .btn-gold:hover {
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
        }

        /* Glass Buttons */
        .btn-glass {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .btn i {
            margin-right: 12px;
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .btn:hover i {
            transform: scale(1.2) rotate(-5deg);
        }

        /* --- FOOTER (LOGO) --- */
        .footer {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        
        .footer:hover {
            opacity: 1;
        }

        .powered-by {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .footer-logo {
            height: 30px; /* Adjust size here */
            width: auto;
            /* Filter to make logo white/gold if needed, or upload a PNG */
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); 
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="ambient-light">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- Main Card -->
    <div class="glass-card">
        
        <!-- Profile Picture -->
        <div class="profile-wrapper">
            <!-- Ensure this file name matches exactly what is in GitHub -->
            <img src="profile.jpg" alt="Anshad" class="profile-img">
        </div>

        <!-- Text Details -->
        <h1>Anshad</h1>
        <div class="title">Lead Designer</div>
        <div class="agency">ALFAYIZ GRAPHICS</div>

        <!-- Buttons -->
        <div class="btn-container">
            <!-- Save Contact (Primary) -->
            <!-- Ensure this filename matches exactly what is in GitHub -->
            <a href="Anshad_Ep.vcf" class="btn btn-gold">
                <i class="fas fa-address-card"></i> Save Contact
            </a>

            <!-- Social Links -->
            <a href="https://wa.me/971500000000" class="btn btn-glass">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>

            <a href="https://alfayiz.com" class="btn btn-glass">
                <i class="fas fa-globe"></i> Visit Website
            </a>
            
            <a href="mailto:anshad@alfayiz.com" class="btn btn-glass">
                <i class="fas fa-envelope"></i> Email Me
            </a>
        </div>

        <!-- Updated Footer with Logo -->
        <div class="footer">
            <div class="powered-by">Powered by</div>
            <!-- UPLOAD YOUR LOGO AS: alfayiz-logo.png -->
            <img src="alfayiz-logo.png" alt="Alfayiz Digital" class="footer-logo">
        </div>

    </div>

</body>
</html>
